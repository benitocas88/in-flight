[project]
name = "in-flight"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3==1.44.12",
    "botocore==1.44.12",
    "celery[sqs]==5.7.0",
    "flask==3.1.3",
    "httpx==0.29.0",
    "pydantic==2.14.4",
    "structlog==26.1.0",
    "pycurl==7.49.0",
    "kombu"
]

[dependency-groups]
dev = [
    "watchdog[watchmedo]==7.1.1",
    "pytest-celery==1.3.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-xdist==3.8.0",
    "pytest-sugar==1.1.1",
]

[tool.uv]
package = false

[tool.uv.sources]
kombu = { git = "https://github.com/celery/kombu", rev = "9d75db121a3f77ea587e50d951a2c65b7d2b8605" }

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "flight"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.pytest.ini_options]
minversion = 7.2
addopts = "-x --durations=5 -n 2"
testpaths = ["tests"]
python_files = "test_*"
required_plugins = "pytest-celery"
cache_dir = "/tmp/pytest_cache/.pytest_cache"
