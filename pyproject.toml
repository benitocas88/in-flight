[project]
name = "in-flight"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3",
    "botocore",
    "celery[sqs]",
    "flask",
    "httpx",
    "pydantic",
    "structlog",
    "pycurl",
    "python-json-logger",
    "logging-json",
]

[dependency-groups]
dev = [
    "watchdog[watchmedo]",
    "pytest-celery",
    "ruff",
    "mypy",
    "pytest",
    "pytest-xdist",
    "pytest-sugar",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
minversion = 7.2
addopts = "-x --durations=5 -n 2"
testpaths = ["tests"]
python_files = "test_*"
required_plugins = "pytest-celery"
cache_dir = "/home/pingook/.pytest_cache"
