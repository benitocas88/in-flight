version: 2
updates:
  # Python dependencies managed by uv
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Base images in Dockerfile and Dockerfile.aws-emulator
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
