x-deploy: &default-deploy
  resources:
    limits:
      cpus: "1"
      memory: "2048MB"

x-service: &default-service
  image: in/flight:latest
  build:
    context: .
    args:
      - REQUIREMENTS=all
  env_file:
    - .env.local

services:
  flight:
    << : *default-service
    depends_on:
      aws-emulator:
        condition: service_started
      stack-init:
        condition: service_completed_successfully
    command: >
      bash -c "watchmedo auto-restart --pattern='*.py' --directory='/home/in-flight/app/' --recursive --
      celery -A app.celery worker --loglevel=INFO -E -Ofair --pidfile /tmp/celery.pid"
    network_mode: "service:aws-emulator"
    volumes:
      - "./src:/home/in-flight/app:rw"
      - "aws-emulator-state:/aws-emulator:ro"
    deploy: *default-deploy
    environment:
      BROKER_URL: "sqs://127.0.0.1:9297"
      DEFAULT_QUEUE_NAME: "in-flight"
      AWS_SQS_REGION_NAME: "us-east-2"
      AWS_SQS_TRANSPORT_SECURE: "true"
      AWS_SHARED_CREDENTIALS_FILE: "/aws-emulator/9297/emulator_credentials"
      AWS_CA_BUNDLE: "/aws-emulator/9297/ca.pem"
      AWS_CONFIG_FILE: "/dev/null"
      AWS_DEFAULT_REGION: "us-east-2"
      AWS_PROFILE: "default"
      AWS_DEFAULT_PROFILE: "default"
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""

  aws-emulator:
    build:
      context: .
      dockerfile: Dockerfile.aws-emulator
    volumes:
      - "aws-emulator-state:/home/emulator/.aws/emulator"

  stack-init:
    image: amazon/aws-cli:2.35.0
    entrypoint: ["/bin/sh", "/opt/create-stack.sh"]
    depends_on:
      aws-emulator:
        condition: service_started
    network_mode: "service:aws-emulator"
    user: "1000:1000"
    environment:
      AWS_SHARED_CREDENTIALS_FILE: "/aws-emulator/9297/emulator_credentials"
      AWS_CA_BUNDLE: "/aws-emulator/9297/ca.pem"
      AWS_DEFAULT_REGION: "us-east-2"
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
      AWS_EMULATOR_ENDPOINT: "https://127.0.0.1:9297"
    volumes:
      - "aws-emulator-state:/aws-emulator:ro"
      - "./.aws/create-stack.sh:/opt/create-stack.sh:ro"
    restart: "no"

volumes:
  aws-emulator-state:
